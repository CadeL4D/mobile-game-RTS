name: Build unsigned iOS IPA

# Structure follows the proven pipeline in the embergard--nightkeep project.
# Godot emits an Xcode PROJECT (application/export_project_only=true in
# export_presets.cfg), xcodebuild compiles it with signing switched off, and the
# resulting .app is zipped into the Payload/ layout that makes a .ipa. Letting
# Godot produce the .ipa itself would invoke a signing step we have no
# certificate for.

on:
  workflow_dispatch:
  push:
    # Building main as well as tags means a broken pipeline is caught before a
    # version number is spent on it. Only tag builds publish a prerelease.
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: unsigned-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # 4.7.1 is the current compatible maintenance release and carries the first
  # round of critical 4.7 crash fixes. Keep editor and templates on one version.
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "stable"
  IOS_PRESET: "iOS"
  APP_NAME: "Ruinward"

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    # Must be new enough to carry an iOS SDK matching the one Godot's official
    # template was built against. On older images the link fails with missing
    # symbols like _MTLTensorDomain and _NSProcessPerformanceProfileDefault —
    # Metal 4 / iOS 26 APIs that do not exist in an earlier SDK.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Pick the newest Xcode the image has rather than trusting the default.
      # Printed loudly because an SDK mismatch surfaces much later as an
      # inscrutable wall of undefined symbols.
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          echo "available:"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "  (none found)"
          NEWEST="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$NEWEST" ]; then
            sudo xcode-select -s "$NEWEST/Contents/Developer"
          fi
          echo "--- selected ---"
          xcodebuild -version
          echo "--- iOS SDKs ---"
          xcodebuild -showsdks | grep -i ios || true

      # The template archive is ~1 GB, so it is cached across runs. The key
      # includes the Godot version, so bumping the engine correctly misses.
      - name: Cache Godot export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/Godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Install Godot editor
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download"
          TAG="${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fL -o godot.zip "${BASE}/${TAG}/Godot_v${TAG}_macos.universal.zip"
          unzip -q godot.zip
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$PWD/Godot.app/Contents/MacOS/Godot" /usr/local/bin/godot
          godot --version

      - name: Install iOS export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download"
          TAG="${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -fL -o templates.tpz "${BASE}/${TAG}/Godot_v${TAG}_export_templates.tpz"
          unzip -q templates.tpz
          DEST="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$DEST"
          mv templates/* "$DEST/"
          ls "$DEST" | head -20

      # A fresh checkout has no .godot/, so no global script class cache exists.
      # Running the project in that state makes every class_name symbol
      # (GameCommand, RegionGenerator, ...) fail to resolve, main.gd fails to
      # parse, the main scene never instantiates, and the process sits in an
      # empty main loop until the job times out. The first editor pass often
      # exits non-zero while still doing the work and a second settles anything
      # it missed, so the step is judged on what it produced, not what it
      # returned.
      - name: Import project and build the script class cache
        timeout-minutes: 20
        run: |
          godot --headless --editor --quit >/dev/null 2>&1 || true
          godot --headless --editor --quit >/dev/null 2>&1 || true
          if [ ! -s .godot/global_script_class_cache.cfg ]; then
            echo "import produced no script class cache; class_name symbols would not resolve" >&2
            ls -la .godot 2>&1 >&2 || echo "(no .godot directory)" >&2
            exit 1
          fi
          echo "script class cache present"

      - name: Run cross-platform project smoke suite
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . \
            --log-file build/github-ios-tests.log -- --run-tests --ci-smoke \
            2>&1 | tee build/github-ios-tests-console.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" \
            build/github-ios-tests.log build/github-ios-tests-console.log; then
            echo "Godot reported a script or runtime error even if the test harness printed PASS." >&2
            exit 1
          fi
          if ! grep -q "TEST RESULT: PASS" build/github-ios-tests-console.log; then
            echo "The regression suite did not reach its explicit PASS marker." >&2
            exit 1
          fi

      # The smoke suite never builds the interface, so it cannot see a control
      # that swallows pointer input before the world view receives it. That
      # shipped once as a game where nothing could be tapped, dragged or zoomed.
      - name: Check pointer input reaches the world
        timeout-minutes: 10
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 600 -- --input-probe 2>&1 | tee build/input-probe.log
          grep -q "INPUT PROBE" build/input-probe.log

      # Nothing in the suite could see that the world took 167 ms a frame to draw
      # at the zoom the game opened at — six frames a second — because every
      # performance figure until now was taken by hand on a desktop. This measures
      # the cost of a world redraw across the zoom range and fails on a collapse.
      - name: Check the world redraw stays within budget
        timeout-minutes: 15
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 60000 -- --frame-budget 2>&1 | tee build/frame-budget.log
          grep -q "FRAME BUDGET worst" build/frame-budget.log

      - name: Export Godot project to Xcode
        timeout-minutes: 20
        run: |
          set -euo pipefail
          rm -rf build/ios
          mkdir -p build/ios
          godot --headless --path . \
            --log-file build/ios/godot-ios-export.log \
            --export-release "${IOS_PRESET}" "build/ios/${APP_NAME}.xcodeproj"
          echo "--- export output ---"
          ls -la build/ios

      # The smoke suite runs from source, where everything the exclude filters
      # strip is still on disk, so it cannot see a build that is broken only once
      # packed. Running the exported pack catches that: a preload of a stripped
      # path, or any missing resource, fails to parse at startup and ships as a
      # black screen. Run from a directory with no project.godot, otherwise Godot
      # loads the checkout instead of the pack and the check passes vacuously.
      - name: Validate the exported pack
        timeout-minutes: 10
        run: |
          set -euo pipefail
          PACK="$PWD/build/ios/${APP_NAME}.pck"
          test -s "$PACK" || (echo "the export produced no .pck" && exit 1)
          WORKDIR="$RUNNER_TEMP/pack-validation"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          godot --headless --main-pack "$PACK" --quit-after 300 2>&1 | tee pack-run.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" pack-run.log; then
            echo "The exported pack fails at runtime even though the export step succeeded." >&2
            exit 1
          fi
          echo "exported pack boots clean"

      - name: Build unsigned .app
        working-directory: build/ios
        timeout-minutes: 40
        run: |
          set -euo pipefail
          PROJ="$(ls -d *.xcodeproj | head -1)"
          SCHEME="$(basename "$PROJ" .xcodeproj)"
          echo "building $PROJ (scheme $SCHEME)"
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build

      # A .ipa is just a zip with the .app inside a top-level Payload/ folder.
      - name: Package and verify unsigned IPA
        id: package
        working-directory: build/ios
        run: |
          set -euo pipefail
          APP="$(find ./DerivedData -name '*.app' -type d | head -1)"
          test -n "$APP" || (echo "no .app was produced" && exit 1)
          echo "packaging $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/

          PACKAGED="Payload/$(basename "$APP")"
          find "$PACKAGED" -type d -name _CodeSignature -prune -exec rm -rf {} +
          find "$PACKAGED" -type f -name embedded.mobileprovision -delete
          if codesign --verify --deep --strict "$PACKAGED" >/dev/null 2>&1; then
            echo "Application unexpectedly contains a valid code signature." >&2
            exit 1
          fi
          plutil -lint "$PACKAGED/Info.plist"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PACKAGED/Info.plist")"
          test -x "$PACKAGED/$EXECUTABLE"
          lipo -info "$PACKAGED/$EXECUTABLE"

          IPA="${APP_NAME}-unsigned.ipa"
          rm -f "$IPA"
          zip -qry "$IPA" Payload
          unzip -tq "$IPA"
          CHECKSUM="$(shasum -a 256 "$IPA" | awk '{print $1}')"
          echo "$CHECKSUM  $IPA" > "${IPA}.sha256"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ruinward-unsigned-ipa-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            build/ios/Ruinward-unsigned.ipa
            build/ios/Ruinward-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Attach unsigned IPA to tagged prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ruinward ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: false
          body: |
            Automated unsigned iOS development build.

            This IPA is intentionally unsigned. It must be re-signed with your own
            Apple account by a sideloader (AltStore, Sideloadly, TrollStore) before
            it can be installed on an iPhone or iPad.
          files: |
            build/ios/Ruinward-unsigned.ipa
            build/ios/Ruinward-unsigned.ipa.sha256

      - name: Upload build logs after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          path: |
            build/github-ios-tests.log
            build/github-ios-tests-console.log
            build/ios/*.log
          name: Ruinward-ios-failure-logs-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Write build summary
        if: success()
        run: |
          {
            echo "## Unsigned iOS build"
            echo
            echo "Artifact: \`Ruinward-unsigned-ipa-${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}\`"
            echo
            echo "SHA-256: \`${{ steps.package.outputs.checksum }}\`"
            echo
            echo "This IPA is intentionally unsigned and must be re-signed by a sideloader before installation."
          } >> "$GITHUB_STEP_SUMMARY"
